<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HopVet Clinic Data Editor</title>
<style>
  :root {
    --bg: #F7FAF8;
    --card: #FFFFFF;
    --border: #D8E0DC;
    --accent: #3F5A44;
    --accent-text: #FFFFFF;
    --text: #1F3325;
    --muted: #6B7A70;
    --warn-bg: #FFF4E5;
    --warn-border: #E0B060;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

  .toolbar {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .toolbar label.file-label {
    background: var(--accent);
    color: var(--accent-text);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
  }
  .toolbar input[type=file] { display: none; }
  .toolbar button {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  .toolbar button:disabled { opacity: 0.4; cursor: default; }
  .status { font-size: 13px; color: var(--muted); }

  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }

  .clinic-list-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .clinic-list-panel input[type=search] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .clinic-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .clinic-item:hover { background: var(--bg); }
  .clinic-item.selected { background: var(--accent); color: var(--accent-text); }
  .review-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warn-border);
    flex-shrink: 0;
  }

  .form-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .empty-state { color: var(--muted); font-size: 15px; }

  .section { margin-bottom: 28px; }
  .section h2 {
    font-size: 15px;
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .field-grid.wide { grid-template-columns: 1fr; }
  @media (max-width: 600px) { .field-grid { grid-template-columns: 1fr; } }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .field input[type=text], .field input[type=number], .field input[type=url], .field textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .field textarea { min-height: 60px; resize: vertical; }
  .checkbox-field { display: flex; align-items: center; gap: 8px; }
  .checkbox-field label { margin: 0; font-size: 14px; color: var(--text); }

  .review-banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .review-banner strong { display: block; margin-bottom: 4px; }
  .review-banner .old-text {
    font-family: monospace;
    background: rgba(255,255,255,0.6);
    padding: 6px 8px;
    border-radius: 4px;
    margin-top: 6px;
    font-size: 13px;
    word-break: break-word;
  }

  .day-row {
    display: grid;
    grid-template-columns: 90px repeat(4, 1fr) 30px;
    gap: 8px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .day-row:last-child { border-bottom: none; }
  .day-row .day-name { font-weight: 600; font-size: 14px; }
  .day-row.emergency-row {
    padding-top: 0;
    padding-bottom: 8px;
  }
  .day-row.emergency-row .emergency-label {
    font-weight: normal;
    font-size: 12px;
    color: var(--muted);
  }
  .day-row input[type=time] {
    width: 100%;
    padding: 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .day-row input[type=time]:disabled { background: #F0F0F0; color: #AAA; }
  .day-notes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 0 12px 98px;
  }
  .day-notes input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .day-notes input::placeholder { color: #B7C0BB; }

  .phone-quick-picks {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .phone-quick-pick {
    margin-left: 6px;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 12px;
    cursor: pointer;
  }
  .phone-quick-pick:hover {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
</style>
</head>
<body>

<h1>HopVet Clinic Data Editor</h1>
<p class="subtitle">Load your clinics.json, edit through the form below, then download the updated file to upload to GitHub.</p>

<div class="toolbar">
  <label class="file-label">
    Load clinics.json
    <input type="file" id="fileInput" accept=".json" />
  </label>
  <button id="addClinicBtn" disabled>+ Add new clinic</button>
  <button id="downloadBtn" disabled>Download updated clinics.json</button>
  <span class="status" id="statusText">No file loaded yet.</span>
</div>

<div class="layout" id="mainLayout" style="display:none;">
  <div class="clinic-list-panel">
    <input type="search" id="searchBox" placeholder="Search clinics..." />
    <div id="clinicList"></div>
  </div>
  <div class="form-panel" id="formPanel">
    <p class="empty-state">Select a clinic on the left to start editing.</p>
  </div>
</div>

<script>
const DAY_CODES = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun", "Holiday"];
const DAY_LABELS = { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday", Holiday: "Public Holiday" };
const KRAJ_OPTIONS = [
  "Hlavní město Praha", "Středočeský kraj", "Jihočeský kraj", "Plzeňský kraj",
  "Karlovarský kraj", "Ústecký kraj", "Liberecký kraj", "Královéhradecký kraj",
  "Pardubický kraj", "Kraj Vysočina", "Jihomoravský kraj", "Olomoucký kraj",
  "Zlínský kraj", "Moravskoslezský kraj",
];

let clinics = [];
let selectedId = null;

const fileInput = document.getElementById("fileInput");
const addClinicBtn = document.getElementById("addClinicBtn");
const downloadBtn = document.getElementById("downloadBtn");
const statusText = document.getElementById("statusText");
const mainLayout = document.getElementById("mainLayout");
const clinicListEl = document.getElementById("clinicList");
const formPanel = document.getElementById("formPanel");
const searchBox = document.getElementById("searchBox");

fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      clinics = JSON.parse(event.target.result);
      statusText.textContent = `Loaded ${clinics.length} clinics.`;
      downloadBtn.disabled = false;
      addClinicBtn.disabled = false;
      mainLayout.style.display = "grid";
      renderClinicList();
    } catch (err) {
      statusText.textContent = "Error: that file isn't valid JSON. Nothing was changed.";
    }
  };
  reader.readAsText(file);
});

function blankDayEntry() {
  return { closed: true, start1: "", end1: "", start2: "", end2: "", emergency_start1: "", emergency_end1: "", emergency_start2: "", emergency_end2: "", note_en: "", note_cs: "" };
}

function createBlankClinic() {
  const newId = clinics.length ? Math.max(...clinics.map((c) => c.id)) + 1 : 1;
  const weekly_hours = {};
  DAY_CODES.forEach((day) => { weekly_hours[day] = blankDayEntry(); });
  return {
    id: newId,
    name: "New clinic",
    region: "",
    address: "",
    lat: null,
    lng: null,
    phone: "",
    website: "",
    top_pick: false,
    recommended_vet: "",
    hours: "",
    google_maps_url: "",
    district: "",
    kraj: "",
    is_prague: false,
    is_brno: false,
    is_ostrava: false,
    is_24_7: false,
    has_weekend_emergency: false,
    notes_en: "",
    notes_cs: "",
    emergency_en: "",
    emergency_cs: "",
    facebook_url: "",
    instagram_url: "",
    internal_contact_email: "",
    call_phone: "",
    google_rating: null,
    google_review_count: null,
    hospitalization: false,
    english_communication: false,
    weekly_hours,
    hours_needs_review: false,
  };
}

addClinicBtn.addEventListener("click", () => {
  const clinic = createBlankClinic();
  clinics.push(clinic);
  selectedId = clinic.id;
  renderClinicList();
  renderForm(clinic);
  // Scroll straight to the name field so it's obvious what to fill in first.
  const nameField = formPanel.querySelector('[data-field="name"]');
  if (nameField) { nameField.focus(); nameField.select(); }
});

searchBox.addEventListener("input", renderClinicList);

function renderClinicList() {
  const query = searchBox.value.trim().toLowerCase();
  const sorted = [...clinics].sort((a, b) => a.name.localeCompare(b.name));
  clinicListEl.innerHTML = "";
  for (const clinic of sorted) {
    if (query && !clinic.name.toLowerCase().includes(query)) continue;
    const div = document.createElement("div");
    div.className = "clinic-item" + (clinic.id === selectedId ? " selected" : "");
    div.innerHTML = `<span>${escapeHtml(clinic.name)}</span>` + (clinic.hours_needs_review ? '<span class="review-dot" title="Hours need review"></span>' : "");
    div.addEventListener("click", () => {
      selectedId = clinic.id;
      renderClinicList();
      renderForm(clinic);
    });
    clinicListEl.appendChild(div);
  }
}

function getClinic(id) {
  return clinics.find((c) => c.id === id);
}

function updateField(id, field, value) {
  const clinic = getClinic(id);
  clinic[field] = value;
}

// If the phone field looks like it has more than one number (split on
// "/"), shows small buttons for each one - clicking a button fills the
// call_phone field with that specific number. If there's only one
// number, no buttons are needed (the plain text field is enough).
function renderPhoneQuickPicks(phone) {
  if (!phone || !phone.includes("/")) return "";
  const parts = phone.split("/").map((p) => p.trim()).filter(Boolean);
  if (parts.length < 2) return "";
  const buttons = parts.map((part) =>
    `<button type="button" class="phone-quick-pick" data-phone-value="${attr(part)}">${escapeHtml(part)}</button>`
  ).join("");
  return `<div class="phone-quick-picks">Quick pick: ${buttons}</div>`;
}

function renderForm(clinic) {
  const html = `
    <div class="section">
      <h2>Identity &amp; location <span style="font-weight:normal;color:var(--muted);font-size:13px;">(id ${clinic.id})</span></h2>
      <div class="field-grid">
        <div class="field">
          <label>Clinic name</label>
          <input type="text" data-field="name" data-resync-list="true" value="${attr(clinic.name)}" />
        </div>
        <div class="field">
          <label>City / region label (e.g. "Brno")</label>
          <input type="text" data-field="region" value="${attr(clinic.region)}" />
        </div>
        <div class="field" style="grid-column:1/-1;">
          <label>Address</label>
          <input type="text" data-field="address" value="${attr(clinic.address)}" />
        </div>
        <div class="field">
          <label>Latitude</label>
          <input type="text" data-field="lat" data-type="number" value="${clinic.lat ?? ""}" placeholder="e.g. 49.9503741" />
        </div>
        <div class="field">
          <label>Longitude</label>
          <input type="text" data-field="lng" data-type="number" value="${clinic.lng ?? ""}" placeholder="e.g. 17.8682736" />
        </div>
        <div class="field" style="grid-column:1/-1;">
          <label>Google Maps URL</label>
          <input type="text" data-field="google_maps_url" value="${attr(clinic.google_maps_url)}" />
        </div>
        <div class="field">
          <label>Kraj</label>
          <select data-field="kraj">
            <option value="">-- select --</option>
            ${KRAJ_OPTIONS.map((k) => `<option value="${attr(k)}" ${clinic.kraj === k ? "selected" : ""}>${escapeHtml(k)}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label>District (optional, informational)</label>
          <input type="text" data-field="district" value="${attr(clinic.district)}" />
        </div>
      </div>
      <div class="field-grid" style="margin-top:14px;">
        <div class="checkbox-field">
          <input type="checkbox" id="chk_prague" data-field="is_prague" data-type="checkbox" ${clinic.is_prague ? "checked" : ""} />
          <label for="chk_prague">In Prague</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="chk_brno" data-field="is_brno" data-type="checkbox" ${clinic.is_brno ? "checked" : ""} />
          <label for="chk_brno">In Brno</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="chk_ostrava" data-field="is_ostrava" data-type="checkbox" ${clinic.is_ostrava ? "checked" : ""} />
          <label for="chk_ostrava">In Ostrava</label>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Contact &amp; details</h2>
      <div class="field-grid">
        <div class="field">
          <label>Phone (full text, as found - can contain multiple numbers)</label>
          <input type="text" data-field="phone" value="${attr(clinic.phone)}" />
        </div>
        <div class="field">
          <label>Call button number (the ONE number used on the site's Call button)</label>
          <input type="text" data-field="call_phone" value="${attr(clinic.call_phone)}" />
          ${renderPhoneQuickPicks(clinic.phone)}
        </div>
        <div class="field">
          <label>Website</label>
          <input type="text" data-field="website" value="${attr(clinic.website)}" />
        </div>
        <div class="field">
          <label>Recommended vet</label>
          <input type="text" data-field="recommended_vet" value="${attr(clinic.recommended_vet)}" />
        </div>
        <div class="field">
          <label>Google rating (e.g. 4.5)</label>
          <input type="number" step="0.1" min="0" max="5" data-field="google_rating" data-type="number" value="${clinic.google_rating ?? ""}" />
        </div>
        <div class="field">
          <label>Google review count</label>
          <input type="number" step="1" min="0" data-field="google_review_count" data-type="number" value="${clinic.google_review_count ?? ""}" />
        </div>
        <div class="field">
          <label>Facebook URL</label>
          <input type="text" data-field="facebook_url" value="${attr(clinic.facebook_url)}" />
        </div>
        <div class="field">
          <label>Instagram URL</label>
          <input type="text" data-field="instagram_url" value="${attr(clinic.instagram_url)}" />
        </div>
      </div>
      <div class="field-grid" style="margin-top:14px;">
        <div class="checkbox-field">
          <input type="checkbox" id="chk_top_pick" data-field="top_pick" data-type="checkbox" ${clinic.top_pick ? "checked" : ""} />
          <label for="chk_top_pick">Top pick</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="chk_247" data-field="is_24_7" data-type="checkbox" ${clinic.is_24_7 ? "checked" : ""} />
          <label for="chk_247">Open 24/7</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="chk_weekend_em" data-field="has_weekend_emergency" data-type="checkbox" ${clinic.has_weekend_emergency ? "checked" : ""} />
          <label for="chk_weekend_em">Has weekend emergency care</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="chk_hosp" data-field="hospitalization" data-type="checkbox" ${clinic.hospitalization ? "checked" : ""} />
          <label for="chk_hosp">Offers hospitalization</label>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="chk_english" data-field="english_communication" data-type="checkbox" ${clinic.english_communication ? "checked" : ""} />
          <label for="chk_english">Staff communicate in English</label>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Notes &amp; emergency text</h2>
      <div class="field-grid">
        <div class="field">
          <label>Notes (English)</label>
          <textarea data-field="notes_en">${escapeHtml(clinic.notes_en)}</textarea>
        </div>
        <div class="field">
          <label>Notes (Czech)</label>
          <textarea data-field="notes_cs">${escapeHtml(clinic.notes_cs)}</textarea>
        </div>
        <div class="field">
          <label>Emergency info (English)</label>
          <textarea data-field="emergency_en">${escapeHtml(clinic.emergency_en)}</textarea>
        </div>
        <div class="field">
          <label>Emergency info (Czech)</label>
          <textarea data-field="emergency_cs">${escapeHtml(clinic.emergency_cs)}</textarea>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Internal use only <span style="font-weight:normal;color:var(--muted);font-size:13px;">(never shown on the public website)</span></h2>
      <div class="field-grid">
        <div class="field">
          <label>Contact email (for newsletters, outreach, etc.)</label>
          <input type="text" data-field="internal_contact_email" value="${attr(clinic.internal_contact_email)}" />
        </div>
      </div>
    </div>

    <div class="section">
      <h2>Opening hours</h2>
      ${clinic.hours_needs_review ? `
        <div class="review-banner">
          <strong>⚠ Flagged for manual review</strong>
          This clinic's old hours text didn't fit neatly into the day-by-day grid below, so the site is currently showing the original text as-is. Fill in the grid below using the reference text, then uncheck the box to make it live.
          <div class="old-text">${escapeHtml(clinic.hours || "(no old text saved)")}</div>
        </div>
      ` : ""}
      <div class="checkbox-field" style="margin-bottom:14px;">
        <input type="checkbox" id="chk_needs_review" data-field="hours_needs_review" data-type="checkbox" ${clinic.hours_needs_review ? "checked" : ""} />
        <label for="chk_needs_review">Needs review (show old text instead of the grid below)</label>
      </div>
      ${DAY_CODES.map((day) => renderDayRow(clinic, day)).join("")}
    </div>
  `;
  formPanel.innerHTML = html;
  attachFieldListeners(clinic.id);
}

function renderDayRow(clinic, day) {
  const entry = (clinic.weekly_hours && clinic.weekly_hours[day]) || {
    closed: true, start1: "", end1: "", start2: "", end2: "",
    emergency_start1: "", emergency_end1: "", emergency_start2: "", emergency_end2: "",
    note_en: "", note_cs: "",
  };
  const disabled = entry.closed ? "disabled" : "";
  return `
    <div class="day-row">
      <span class="day-name">${DAY_LABELS[day]}</span>
      <input type="text" inputmode="numeric" placeholder="HH:MM" data-day="${day}" data-day-field="start1" data-time-field="true" value="${attr(entry.start1)}" ${disabled} />
      <input type="text" inputmode="numeric" placeholder="HH:MM" data-day="${day}" data-day-field="end1" data-time-field="true" value="${attr(entry.end1)}" ${disabled} />
      <input type="text" inputmode="numeric" placeholder="HH:MM" data-day="${day}" data-day-field="start2" data-time-field="true" value="${attr(entry.start2)}" ${disabled} />
      <input type="text" inputmode="numeric" placeholder="HH:MM" data-day="${day}" data-day-field="end2" data-time-field="true" value="${attr(entry.end2)}" ${disabled} />
      <div class="checkbox-field">
        <input type="checkbox" data-day="${day}" data-day-field="closed" data-type="checkbox" ${entry.closed ? "checked" : ""} title="Closed" />
      </div>
    </div>
    <div class="day-row emergency-row">
      <span class="day-name emergency-label">↳ Emergency</span>
      <input type="text" inputmode="numeric" placeholder="HH:MM" data-day="${day}" data-day-field="emergency_start1" data-time-field="true" value="${attr(entry.emergency_start1)}" />
      <input type="text" inputmode="numeric" placeholder="HH:MM" data-day="${day}" data-day-field="emergency_end1" data-time-field="true" value="${attr(entry.emergency_end1)}" />
      <input type="text" inputmode="numeric" placeholder="HH:MM" data-day="${day}" data-day-field="emergency_start2" data-time-field="true" value="${attr(entry.emergency_start2)}" />
      <input type="text" inputmode="numeric" placeholder="HH:MM" data-day="${day}" data-day-field="emergency_end2" data-time-field="true" value="${attr(entry.emergency_end2)}" />
      <div></div>
    </div>
    <div class="day-notes">
      <input type="text" placeholder="Note (English) - for anything that doesn't fit the fields above" data-day="${day}" data-day-field="note_en" value="${attr(entry.note_en)}" />
      <input type="text" placeholder="Poznámka (česky)" data-day="${day}" data-day-field="note_cs" value="${attr(entry.note_cs)}" />
    </div>
  `;
}

// Turns whatever someone typed into a time field into a clean 24h
// "HH:MM" format - e.g. "9" -> "09:00", "9:5" -> "09:05", "17:3" -> "17:30".
// Runs on blur, so the field still feels natural to type into.
function normalizeTimeString(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return "";
  const match = trimmed.match(/^(\d{1,2}):?(\d{0,2})$/);
  if (!match) return trimmed; // don't mangle something unexpected - let the person notice and fix it
  let [, hour, minute] = match;
  hour = hour.padStart(2, "0");
  minute = (minute || "0").padEnd(2, "0").slice(0, 2);
  return `${hour}:${minute}`;
}

function attachFieldListeners(clinicId) {
  const clinic = getClinic(clinicId);

  // Plain top-level fields
  formPanel.querySelectorAll("[data-field]").forEach((el) => {
    const field = el.dataset.field;
    const type = el.dataset.type;
    const isSelect = el.tagName === "SELECT";
    const eventName = (type === "checkbox" || isSelect) ? "change" : "input";
    el.addEventListener(eventName, () => {
      if (type === "checkbox") {
        clinic[field] = el.checked;
        if (field === "hours_needs_review") renderForm(clinic); // refresh banner + day grid state
      } else if (type === "number") {
        clinic[field] = el.value === "" ? null : Number(el.value);
      } else {
        clinic[field] = el.value;
      }
      if (el.dataset.resyncList) renderClinicList();
    });
  });

  // Phone quick-pick buttons: clicking one fills the call_phone field
  // (and the data model) with that specific number.
  formPanel.querySelectorAll(".phone-quick-pick").forEach((btn) => {
    btn.addEventListener("click", () => {
      const value = btn.dataset.phoneValue;
      clinic.call_phone = value;
      const callPhoneInput = formPanel.querySelector('[data-field="call_phone"]');
      if (callPhoneInput) callPhoneInput.value = value;
    });
  });

  // Per-day fields
  formPanel.querySelectorAll("[data-day]").forEach((el) => {
    const day = el.dataset.day;
    const dayField = el.dataset.dayField;
    const type = el.dataset.type;
    const isTimeField = el.dataset.timeField === "true";
    const eventName = (type === "checkbox") ? "change" : "input";
    el.addEventListener(eventName, () => {
      if (!clinic.weekly_hours) clinic.weekly_hours = {};
      if (!clinic.weekly_hours[day]) clinic.weekly_hours[day] = { closed: true, start1: "", end1: "", start2: "", end2: "", emergency_start1: "", emergency_end1: "", emergency_start2: "", emergency_end2: "", note_en: "", note_cs: "" };
      const entry = clinic.weekly_hours[day];
      if (type === "checkbox") {
        entry.closed = el.checked;
        renderForm(clinic); // refresh so time inputs enable/disable correctly
      } else {
        entry[dayField] = el.value;
      }
    });

    // On blur, clean up whatever was typed into "HH:MM" and re-save
    // the normalized version, so partial entries like "9" or "9:5"
    // become "09:00" / "09:05" once you move on.
    if (isTimeField) {
      el.addEventListener("blur", () => {
        const normalized = normalizeTimeString(el.value);
        el.value = normalized;
        if (!clinic.weekly_hours) clinic.weekly_hours = {};
        if (!clinic.weekly_hours[day]) clinic.weekly_hours[day] = { closed: true, start1: "", end1: "", start2: "", end2: "", emergency_start1: "", emergency_end1: "", emergency_start2: "", emergency_end2: "", note_en: "", note_cs: "" };
        clinic.weekly_hours[day][dayField] = normalized;
      });
    }
  });
}

downloadBtn.addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(clinics, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "clinics.json";
  a.click();
  URL.revokeObjectURL(url);
});

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function attr(str) {
  return escapeHtml(str || "");
}
